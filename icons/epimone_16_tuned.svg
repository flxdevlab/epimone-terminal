<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Hand-tuned 16px variant of the icon master (epimone-icon-assets/
       epimone.svg, flat body #30333A). The master's geometry does not
       survive rasterization to 16px (the 1.25px chevron stroke lands off
       the pixel grid and breaks apart — the pre-rendered 16px in the asset
       drop has the same defect), so the same design is redrawn here on the
       16px grid: 45-degree chevron arms built as a filled polygon 3px thick
       horizontally (~2.1px true, matching the 2px cursor bar's optical
       weight), square ends, and a 5x2 cursor bar, all on integer
       coordinates. Render with any librsvg frontend at 16x16 to regenerate
       data/icons/hicolor/16x16/apps/org.felix.Epimone.png. -->
  <rect x="1" y="1" width="14" height="14" rx="2" ry="2" fill="#30333A"/>
  <path fill="#33D17A" d="M3 4h3l4 4-4 4H3l4-4z"/>
  <rect x="9" y="11" width="5" height="2" fill="#62A0EA"/>
</svg>
