<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A3D45"/>
      <stop offset="1" stop-color="#26282E"/>
    </linearGradient>
  </defs>

  <!-- Body: Sublime geometry — 448px square, 28px radius -->
  <rect x="32" y="32" width="448" height="448" rx="28" ry="28" fill="url(#body)"/>

  <!-- Chevron: Epimone green (arms symmetric 96x84, ~41°) -->
  <path d="M137 168 L233 252 L137 336"
        fill="none" stroke="#33D17A" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Cursor: Epimone blue, tucked against the chevron on its baseline -->
  <line x1="271" y1="336" x2="375" y2="336"
        stroke="#62A0EA" stroke-width="40" stroke-linecap="round"/>
</svg>
