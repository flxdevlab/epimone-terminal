<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Body: flat Epimone chrome, 448px square, 28px radius. Flat = zero banding on any display. -->
  <rect x="32" y="32" width="448" height="448" rx="28" ry="28" fill="#30333A"/>

  <!-- Chevron: Epimone green -->
  <path d="M137 168 L233 252 L137 336"
        fill="none" stroke="#33D17A" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Cursor: Epimone blue, on the chevron's baseline -->
  <line x1="271" y1="336" x2="375" y2="336"
        stroke="#62A0EA" stroke-width="40" stroke-linecap="round"/>
</svg>
